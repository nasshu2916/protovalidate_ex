name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/verify_proto_sources.sh
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: protovalidate-sbom.spdx.json

  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s test -p '*_test.py'

  test-elixir-versions:
    name: Elixir tests (${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.16.0'
            otp: '26.2.1'
          - elixir: '1.17.3'
            otp: '27.3.3'
          - elixir: '1.18.3'
            otp: '27.3.3'
          - elixir: '1.19.0'
            otp: '28.0'
          - elixir: '1.20.3'
            otp: '29.0'
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: arduino/setup-protoc@v3
        with:
          version: '33.1'
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix dialyzer
      - run: mix test
      - run: mix escript.install hex protobuf 0.17.0 --force
      - run: PROTOC_GEN_ELIXIR="$HOME/.mix/escripts/protoc-gen-elixir" sh scripts/package_smoke.sh
      - run: mix docs
      - run: mix hex.audit
      - run: ./scripts/run_conformance.sh --suite '^standard_rules/(bool|enum|map|repeated)$' --case '^(none/valid|const/true/valid|const/false/valid|const/true/invalid|const/false/invalid|const/valid|const/invalid|min_pairs/valid|min_pairs/invalid)$'
      - run: PROTOVALIDATE_CEL=celixir ./scripts/run_conformance.sh --suite '^custom_rules$'
      - run: sh scripts/check_conformance.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-all-${{ matrix.elixir }}-otp-${{ matrix.otp }}
          path: _build/conformance/all.log
